<!DOCTYPE html>
<html lang="sw">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="U'r Invente by Tembo Cloud: simamia mialiko ya matukio kwa SMS, WhatsApp na email.">
  <meta name="theme-color" content="#3BB8D0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="U'r Invente">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>U'r Invente</title>
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(135deg, #A8F0E0 0%, #5CD6CF 55%, #3BB8D0 100%) fixed; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #08343A; }
    #splash img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 24px rgba(8, 52, 58, .18); }
    #splash .name { margin-top: 16px; font-size: 28px; font-weight: 800; letter-spacing: -.3px; }
    #splash .hint { margin-top: 6px; font-size: 14px; color: #2F5B60; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><div class="name">U'r Invente</div><div class="hint">Inafungua app…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
