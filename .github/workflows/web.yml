# Inajenga web app na kuiweka GitHub Pages (pamoja na sera ya faragha, masharti, kufuta akaunti na RSVP).
#
# Mara moja tu: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Repo variables (si lazima): SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (bila hivi web ni demo),
#   WEB_BASE_URL (default https://<owner>.github.io/<repo>), WEB_BASE_HREF (default /<repo>/; "/" kwa domain yako),
#   SUPPORT_EMAIL, SUPPORT_PHONE.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Jenga web app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          BASE_HREF: ${{ vars.WEB_BASE_HREF || format('/{0}/', github.event.repository.name) }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}
        run: tool/build_web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
