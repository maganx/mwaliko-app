# Inajenga app ya iOS kwenye Mac ya GitHub, na (secrets zikiwepo) inaipakia TestFlight.
#
# Bila secrets: inahakikisha tu kuwa app inajengwa (--no-codesign).
# Secrets za kupakia TestFlight (App Store Connect > Users and Access > Integrations):
#   APPLE_TEAM_ID                 mf. AB12CD34EF
#   APPSTORE_API_KEY_ID           Key ID ya API key (role: App Manager au Admin)
#   APPSTORE_API_ISSUER_ID        Issuer ID
#   APPSTORE_API_PRIVATE_KEY      maudhui ya faili AuthKey_XXXX.p8
#   IOS_DIST_CERT_P12_BASE64      (si lazima) cheti cha Apple Distribution, .p12 kwa base64
#   IOS_DIST_CERT_PASSWORD        (si lazima) nenosiri la .p12
# Repo variables: kama android.yml (SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, WEB_BASE_URL, SUPPORT_*).
name: iOS

on:
  pull_request:
    paths: ["lib/**", "ios/**", "assets/**", "pubspec.*", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Pakia TestFlight"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      HAS_APPSTORE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Mipangilio ya kujenga
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}
        run: python3 tool/dart_defines.py build/defines.json

      - name: Jenga (bila kusaini)
        run: >-
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define-from-file=build/defines.json

      - name: Cheti cha Apple Distribution
        if: env.HAS_APPSTORE_KEY == 'true' && env.HAS_P12 == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Archive na kupakia TestFlight
        if: >-
          env.HAS_APPSTORE_KEY == 'true' &&
          (github.event_name == 'push' || inputs.testflight)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$PRIVATE_KEY" > "$KEY_PATH"
          sed "s/__TEAM_ID__/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive
          # destination=upload: Xcode inapakia moja kwa moja App Store Connect (TestFlight)
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
